baseURL: https://qmhdl1027.github.io/
title: 凉凉秋季
theme: [PaperMod]
languageCode: 'zh-cn'

enableInlineShortcodes: true
enableEmoji: true
enableRobotsTXT: true
hasCJKLanguage: true
paginate: 10
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true

menu:
  main:
    - name: 归档
      url: archives
      weight: 5
    - name: 搜索
      url: search/
      weight: 10
    - name: 标签
      url: tags/
      weight: 15
    - name: 关于
      url: about/
      weight: 20
    - name: RSS
      url: index.xml
      weight: 25

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: qmhdl1027 的个人博客 - 技术笔记与生活记录
  author: qmhdl1027

  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  displayFullLangName: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: false
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: false
  ShowFullTextinRSS: true
  hideFooter: false
  ShowLastMod: false

  homeInfoParams:
    Title: "欢迎来到 qmhdl1027 的博客"
    Content: >
      这里记录技术学习、项目实践与生活思考。

  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    buttons:
      - name: 归档
        url: archives
      - name: 标签
        url: tags

  assets:
    disableHLJS: true
